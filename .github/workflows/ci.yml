name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all
      - run: cargo run --locked -- analyze . --json > /tmp/oxarch-report.json
      - run: node --check src/explorer.js
      - run: python3 scripts/smoke-explorer.py
      - run: python3 scripts/generate-corpus.py 1000 /tmp/oxarch-corpus
      - run: cargo run --locked -- analyze /tmp/oxarch-corpus --json > /tmp/oxarch-cold.json
      - run: cargo run --locked -- analyze /tmp/oxarch-corpus --json > /tmp/oxarch-warm.json
      - name: Compare cold and warm analysis
        run: python3 -c 'import json; assert json.load(open("/tmp/oxarch-cold.json")) == json.load(open("/tmp/oxarch-warm.json"))'
