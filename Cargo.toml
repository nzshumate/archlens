[package]
name = "archlens"
version = "0.1.0"
edition = "2021"
description = "A fast frontend architecture analyzer written in Rust"
license = "MIT"
repository = "https://github.com/nzshumate/archlens"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
petgraph = "0.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
