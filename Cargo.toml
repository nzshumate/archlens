[package]
name = "archlens"
version = "0.2.0"
edition = "2021"
description = "A fast frontend architecture analyzer written in Rust"
license = "MIT"
repository = "https://github.com/nzshumate/archlens"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
oxc_allocator = "0.35"
oxc_ast = "0.35"
oxc_parser = "0.35"
oxc_span = "0.35"
petgraph = "0.6"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
